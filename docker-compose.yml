services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raep-backend
    restart: unless-stopped
    ports:
      - "4044:4044"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raep-frontend
    restart: unless-stopped
    ports:
      - "4043:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:4044
